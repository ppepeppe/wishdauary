spring:
  datasource:
    url: jdbc:h2:mem:wishdiary;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false

logging:
  level:
    org.hibernate.SQL: off

wishdiary:
  auth:
    token-secret: test-token-secret
    token-expiration-seconds: 3600
